name: Publish Pouch Rascalls to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'js/**'
      - 'img/**'
      - 'audio/**'
      - 'css/**'
      - 'fonts/**'
      - 'effects/**'
      - 'icon/**'
      - 'manifest.webmanifest'
      - 'service-worker.js'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify full RPG Maker MZ web project is present
        run: |
          test -f index.html
          test -f js/main.js
          test -f js/rmmz_core.js
          test -f data/System.json
          test -f data/Map001.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
